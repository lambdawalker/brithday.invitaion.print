<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Invitación para {{ name }}</title>
  <style>
    @font-face {
      font-family: "Berkshire Swash";
      src: url("{{ font }}") format("truetype");
      font-weight: 400;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: {{ width }}px; height: {{ height }}px; overflow: hidden; }
    body { display: grid; place-items: center; background: #ded7ef; }
    /* Uniform scaling keeps the picture's reserved area aligned with the lettering. */
    .invitation {
      position: relative;
      width: min({{ width }}px, calc({{ height }}px * 896 / 1184));
      aspect-ratio: 896 / 1184;
      background: linear-gradient(145deg, #ded7fc, #fbd4e7 60%, #fff0d4);
    }
    .background, svg, canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .background { object-fit: contain; }
    svg { overflow: visible; }
    text {
      font-family: "Berkshire Swash", serif;
      font-weight: 400;
      fill: #542451;
      stroke: #fff0da;
      stroke-width: 4px;
      stroke-linejoin: round;
      paint-order: stroke fill;
      text-anchor: middle;
    }
    .copy { stroke-width: 2px; }
    .accent { fill: #a82d60; }
    canvas { pointer-events: none; opacity: .6; }
  </style>
</head>
<body>
  <main class="invitation" aria-label="Invitación de cumpleaños de Abi para {{ name }}">
    {% if background %}<img class="background" src="{{ background }}" alt="">{% endif %}
    <!-- All coordinates use the supplied 896 × 1184 artwork.
         Keep y=474..918 clear: the central silhouette is reserved for the baby.
         All text groups share the horizontal center x=448. -->
    <svg viewBox="0 0 896 1184" role="img" aria-label="Detalles de la fiesta">
      <defs>
        <path id="headline-arc" d="M 66 143 Q 448 -23 830 143"/>
      </defs>
      <text font-size="42" data-fit="760">
        <textPath href="#headline-arc" startOffset="50%">¡Llamado a todos los vikingos!</textPath>
      </text>
      <text id="guest" class="accent" x="448" y="211" font-size="88">{{ name }}</text>
      <g class="copy" font-size="28">
        <text x="448" y="286">{{ invitation_verb }} {{ invitation_word }} al</text>
        <text x="448" y="318" data-fit="450">entrenamiento de dragones en el</text>
      </g>
      <text class="accent" x="448" y="365" font-size="50" data-fit="600">Cumpleaños</text>
      <text class="accent" x="448" y="422" font-size="60">de Abi</text>
      <text x="448" y="461" font-size="35">2 años</text>

      <text x="448" y="981" font-size="43" data-fit="650">Sábado, 24 de octubre</text>
      <text x="448" y="1046" font-size="48">5:00 pm</text>
      <text x="448" y="1092" font-size="32">C. Arquitectura 419</text>
      <text x="448" y="1130" font-size="32">Col. Universidad</text>
    </svg>
    <canvas id="ornaments" aria-hidden="true"></canvas>
  </main>
  <script>
    // The generator awaits this promise before taking its screenshot.
    window.invitationReady = (async () => {
      await document.fonts.load('49px "Berkshire Swash"');
      await document.fonts.ready;
      await Promise.all(Array.from(document.images, image => image.decode()));
      const guest = document.getElementById("guest");
      const name = guest.textContent.trim();
      const words = name.split(/\s+/);
      // Clear of the side ornaments and the copy below; includes glyph overhangs.
      const box = { x: 158, y: 128, width: 580, height: 118 };
      function setLines(lines, size) {
        guest.replaceChildren();
        guest.removeAttribute("transform");
        guest.setAttribute("font-size", size);
        for (const [i, line] of lines.entries()) {
          const span = document.createElementNS("http://www.w3.org/2000/svg", "tspan");
          span.setAttribute("x", "0");
          span.setAttribute("y", String(i * size * 1.08));
          span.textContent = line;
          guest.appendChild(span);
        }
      }
      function measure(lines) {
        setLines(lines, 88);
        const bounds = guest.getBBox();
        return { lines, size: 88 * Math.min(1, (box.width - 8) / bounds.width, (box.height - 8) / bounds.height) };
      }
      let chosen = measure([name]);
      if (chosen.size < 64) {
        for (let i = 1; i < words.length; i++) {
          const candidate = measure([words.slice(0, i).join(" "), words.slice(i).join(" ")]);
          if (candidate.size > chosen.size) chosen = candidate;
        }
      }
      setLines(chosen.lines, chosen.size);
      for (let pass = 0; pass < 4; pass++) {
        const actual = guest.getBBox();
        const factor = Math.min(1, (box.width - 12) / actual.width, (box.height - 12) / actual.height);
        if (factor >= 1) break;
        chosen.size *= factor * .995;
        setLines(chosen.lines, chosen.size);
      }
      const bounds = guest.getBBox();
      guest.setAttribute("transform", "translate(" +
        (box.x + (box.width - bounds.width) / 2 - bounds.x) + " " +
        (box.y + (box.height - bounds.height) / 2 - bounds.y) + ")");
      for (const text of document.querySelectorAll("[data-fit]")) {
        const available = Number(text.dataset.fit);
        const measured = text.getComputedTextLength();
        const size = Number(text.getAttribute("font-size"));
        if (measured > available) text.setAttribute("font-size", size * available / measured);
      }
      const canvas = document.getElementById("ornaments");
      const scale = document.querySelector(".invitation").getBoundingClientRect().width / 896;
      // Supersample fine ornament curves, including in the HTML preview.
      const resolution = scale * Math.max(4, window.devicePixelRatio || 1);
      canvas.width = Math.round(896 * resolution);
      canvas.height = Math.round(1184 * resolution);
      const ctx = canvas.getContext("2d");
      ctx.scale(canvas.width / 896, canvas.height / 1184);
      // Match the guest-name color; smooth paths stay crisp at any export scale.
      const ink = "#a82d60", cream = "#fff0da";
      function flourish(x, y, size = 1, mirror = false) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(mirror ? -size : size, size);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        // Filled ribbon shapes give the curves body and naturally tapered tips.
        const path = new Path2D(
          "M 0 0 C 32 17 58 -23 88 -22 " +
          "C 118 -24 139 -11 132 8 C 128 22 108 25 101 14 " +
          "C 94 1 110 -8 116 1 C 120 9 109 12 107 7 " +
          "C 104 3 103 10 109 14 C 121 23 132 10 127 0 " +
          "C 116 -17 95 -16 80 -10 C 53 0 29 23 0 0 Z"
        );
        const accent = new Path2D(
          "M 5 1 C 30 15 59 4 78 -7 C 57 13 32 24 5 1 Z"
        );
        ctx.strokeStyle = cream; ctx.lineWidth = 3;
        ctx.fillStyle = ink;
        ctx.stroke(path); ctx.fill(path);
        ctx.stroke(accent); ctx.fill(accent);
        ctx.restore();
      }
      function star(x, y) {
        const radius = 9; // Same small size for every star.
        ctx.beginPath();
        ctx.moveTo(x, y - radius);
        ctx.quadraticCurveTo(x + 2, y - 2, x + radius, y);
        ctx.quadraticCurveTo(x + 2, y + 2, x, y + radius);
        ctx.quadraticCurveTo(x - 2, y + 2, x - radius, y);
        ctx.quadraticCurveTo(x - 2, y - 2, x, y - radius);
        ctx.strokeStyle = cream; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = ink; ctx.fill();
      }
      flourish(136, 163, .75, true); flourish(760, 163, .75);
      star(51, 127); star(845, 127);


      flourish(326, 1033, 1.05, true); flourish(570, 1033, 1.05);
      star(178, 1008); star(718, 1008);
      star(260, 1101); star(636, 1101);
    })();
  </script>
</body>
</html>
