<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Invitación para {{ name }} y familia · Abi cumple 2</title>
  <style>
    @font-face { font-family: "Berkshire Swash"; src: url("{{ font }}") format("truetype"); }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: {{ width }}px; height: {{ height }}px; overflow: hidden; }
    body { display: grid; place-items: center; background: #ead8c5; }
    .invitation { position: relative; width: min({{ width }}px, calc({{ height }}px * 1085 / 2048)); aspect-ratio: 1085 / 2048; background: #f3e4d3; }
    .background, svg, canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .background { object-fit: contain; }
    svg { overflow: visible; }
    text { text-anchor: middle; fill: #542451; font-family: "Berkshire Swash", serif;
      font-weight: 400; stroke: #fff0da; stroke-width: 4px;
      stroke-linejoin: round; paint-order: stroke fill; }
    .copy { stroke-width: 2px; }
    .accent { fill: #a82d60; }
    .gifts text { fill: #32162f; }
    canvas { pointer-events: none; opacity: .6; }
  </style>
</head>
<body>
  <main class="invitation" aria-label="Invitación de cumpleaños de Abi para {{ name }} y familia">
    {% if background %}<img class="background" src="{{ background }}" alt="">{% endif %}
    <!-- xxx.jpg is 1085 × 2048. Design coordinates retain a 1136-unit width; the address may overlap the picture's lower edge at y=1440..1540. -->
    <svg viewBox="0 0 1136 2144.2654377880185" role="img" aria-label="Abi cumple dos años. Cambio de horario: ahora a las cuatro de la tarde, antes a las cinco, por el clima.">
      <defs><path id="headline-arc" d="M 100 150 Q 568 -8 1036 150"/></defs>
      <text font-size="52" data-fit="970"><textPath href="#headline-arc" startOffset="50%">¡Llamado a todos los vikingos!</textPath></text>
      <text id="guest" class="accent" x="568" y="197" font-size="104">{{ name }}</text>
      <text x="568" y="328" font-size="38" class="copy">¡Ven con toda tu familia!</text>
      <text x="568" y="405" font-size="76" class="accent">Abi cumple 2 años</text>
      <text x="568" y="470" font-size="44">Sábado 24 de octubre de 2026</text>
      <text x="568" y="581" font-size="43" class="accent">¡Cambio de horario!</text>
      <text x="568" y="660" font-size="76" class="accent">Ahora 4:00 p.m.</text>
      <text x="568" y="711" font-size="35" class="copy">Antes 5:00 p.m.</text>
      <text x="568" y="755" font-size="35" class="copy">Lo adelantamos por el clima</text>

      <!-- The address intentionally overlaps the lower edge of the white picture area. -->
      <text x="568" y="1469" font-size="72" class="accent" data-fit="940">Calle Arquitectura #419</text>
      <text x="568" y="1541" font-size="56" data-fit="940">Fraccionamiento Universidad</text>
      <g class="copy gifts" font-size="52">
        <text x="568" y="1715" data-fit="980">Talla 2 años</text>
        <text x="568" y="1778" data-fit="980">Pijamas y ropa de invierno</text>
        <text x="568" y="1840" data-fit="980">Lluvia de sobres</text>
        <text x="568" y="1903" data-fit="980">Me gusta Toothless y Teletubbies</text>
      </g>
      <g class="accent" font-size="56">
        <text x="568" y="1988" class="accent" data-fit="960">Si gustas, puedes traer</text>
        <text x="568" y="2054" class="accent" data-fit="960">tu cerveza favorita.</text>
      </g>
    </svg>
    <canvas id="ornaments" aria-hidden="true"></canvas>
  </main>
  <script>
    window.invitationReady = (async () => {
      await document.fonts.load('48px "Berkshire Swash"');
      await document.fonts.ready;
      await Promise.all(Array.from(document.images, image => image.decode()));
      const guest = document.getElementById("guest");
      const name = guest.textContent.trim();
      const words = name.split(/\s+/);
      // Clear of the side ornaments and the copy below; includes glyph overhangs.
      const box = { x: 178, y: 114, width: 780, height: 132 };
      function setLines(lines, size) {
        guest.replaceChildren();
        guest.removeAttribute("transform");
        guest.setAttribute("font-size", size);
        for (const [i, line] of lines.entries()) {
          const span = document.createElementNS("http://www.w3.org/2000/svg", "tspan");
          span.setAttribute("x", "0");
          span.setAttribute("y", String(i * size * 1.08));
          span.textContent = line;
          guest.appendChild(span);
        }
      }
      function measure(lines) {
        setLines(lines, 104);
        const bounds = guest.getBBox();
        return { lines, size: 104 * Math.min(1, (box.width - 8) / bounds.width, (box.height - 8) / bounds.height) };
      }
      let chosen = measure([name]);
      if (chosen.size < 64) {
        for (let i = 1; i < words.length; i++) {
          const candidate = measure([words.slice(0, i).join(" "), words.slice(i).join(" ")]);
          if (candidate.size > chosen.size) chosen = candidate;
        }
      }
      setLines(chosen.lines, chosen.size);
      for (let pass = 0; pass < 4; pass++) {
        const actual = guest.getBBox();
        const factor = Math.min(1, (box.width - 12) / actual.width, (box.height - 12) / actual.height);
        if (factor >= 1) break;
        chosen.size *= factor * .995;
        setLines(chosen.lines, chosen.size);
      }
      const bounds = guest.getBBox();
      guest.setAttribute("transform", "translate(" +
        (box.x + (box.width - bounds.width) / 2 - bounds.x) + " " +
        (box.y + (box.height - bounds.height) / 2 - bounds.y) + ")");
      for (const text of document.querySelectorAll('[data-fit]')) {
        const available = Number(text.dataset.fit);
        const measured = text.getComputedTextLength();
        const size = parseFloat(getComputedStyle(text).fontSize);
        if (measured > available) text.setAttribute('font-size', size * available / measured);
      }
      const canvas = document.getElementById("ornaments");
      const scale = document.querySelector(".invitation").getBoundingClientRect().width / 1136;
      // Supersample fine ornament curves, including in the HTML preview.
      const resolution = scale * Math.max(4, window.devicePixelRatio || 1);
      canvas.width = Math.round(1136 * resolution);
      canvas.height = Math.round(2144.2654377880185 * resolution);
      const ctx = canvas.getContext("2d");
      ctx.scale(canvas.width / 1136, canvas.height / 2144.2654377880185);
      // Match the guest-name color; smooth paths stay crisp at any export scale.
      const ink = "#a82d60", cream = "#fff0da";
      function flourish(x, y, size = 1, mirror = false) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(mirror ? -size : size, size);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        // Filled ribbon shapes give the curves body and naturally tapered tips.
        const path = new Path2D(
          "M 0 0 C 32 17 58 -23 88 -22 " +
          "C 118 -24 139 -11 132 8 C 128 22 108 25 101 14 " +
          "C 94 1 110 -8 116 1 C 120 9 109 12 107 7 " +
          "C 104 3 103 10 109 14 C 121 23 132 10 127 0 " +
          "C 116 -17 95 -16 80 -10 C 53 0 29 23 0 0 Z"
        );
        const accent = new Path2D(
          "M 5 1 C 30 15 59 4 78 -7 C 57 13 32 24 5 1 Z"
        );
        ctx.strokeStyle = cream; ctx.lineWidth = 3;
        ctx.fillStyle = ink;
        ctx.stroke(path); ctx.fill(path);
        ctx.stroke(accent); ctx.fill(accent);
        ctx.restore();
      }
      function star(x, y) {
        const radius = 9; // Same small size for every star.
        ctx.beginPath();
        ctx.moveTo(x, y - radius);
        ctx.quadraticCurveTo(x + 2, y - 2, x + radius, y);
        ctx.quadraticCurveTo(x + 2, y + 2, x, y + radius);
        ctx.quadraticCurveTo(x - 2, y + 2, x - radius, y);
        ctx.quadraticCurveTo(x - 2, y - 2, x, y - radius);
        ctx.strokeStyle = cream; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = ink; ctx.fill();
      }
      flourish(155, 179, .85, true); flourish(981, 179, .85);
      star(70, 145); star(1066, 145);
      flourish(294, 636, .9, true); flourish(842, 636, .9);
      star(132, 616); star(1004, 616);
      flourish(80, 1482, .5, true); flourish(1056, 1482, .5);
      star(44, 1450); star(1092, 1450);
    })();
  </script>
</body>
</html>
